name: design_lab

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: design_lab_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      FLUX_USERNAME: ${FLUX_USERNAME}
      FLUX_PASSWORD: ${FLUX_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 9000, $$errno, $$errstr, 1); exit($$socket ? 0 : 1);"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s
    networks:
      - app_network

  node:
    image: node:20-alpine
    container_name: design_lab_node
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "5175:5175"
    command: sh -c "npm install && npm run dev"
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: design_lab_nginx
    restart: unless-stopped
    ports:
      - "8003:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_network

  mysql:
    image: mysql:8.0
    container_name: design_lab_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
